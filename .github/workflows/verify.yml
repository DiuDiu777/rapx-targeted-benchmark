name: Targeted RAPx verify

on:
  workflow_dispatch:
    inputs:
      timeout_minutes:
        description: Timeout for each crate except smallvec (minutes)
        required: true
        default: "15"
      smallvec_timeout_minutes:
        description: Timeout for smallvec (minutes)
        required: true
        default: "120"

permissions:
  contents: write

concurrency:
  group: targeted-rapx-results
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      rapx_version: ${{ steps.rapx.outputs.version }}
      toolchain: ${{ steps.rapx.outputs.toolchain }}
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve latest crates.io RAPx
        id: rapx
        run: |
          python3 scripts/resolve_rapx.py --github-output "$GITHUB_OUTPUT"
      - name: Install release-time nightly
        run: rustup toolchain install "${{ steps.rapx.outputs.toolchain }}" --profile minimal --component rustc-dev,rust-src,llvm-tools-preview
      - name: Install crates.io RAPx
        run: cargo +"${{ steps.rapx.outputs.toolchain }}" install rapx --version "${{ steps.rapx.outputs.version }}" --locked --root "$RUNNER_TEMP/rapx"
      - name: Check RAPx and record toolchain
        run: |
          export PATH="$RUNNER_TEMP/rapx/bin:$PATH"
          export LD_LIBRARY_PATH="$(rustc +${{ steps.rapx.outputs.toolchain }} --print sysroot)/lib:${LD_LIBRARY_PATH:-}"
          cargo +"${{ steps.rapx.outputs.toolchain }}" rapx verify --help
          rustc +"${{ steps.rapx.outputs.toolchain }}" -Vv > "$RUNNER_TEMP/rapx/toolchain.txt"
          echo "${{ steps.rapx.outputs.version }}" > "$RUNNER_TEMP/rapx/version.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: rapx-bin
          path: ${{ runner.temp }}/rapx
          retention-days: 7
      - name: Build matrix
        id: matrix
        run: |
          value="$(python3 - <<'PY'
          import json
          data=json.load(open('targets.json'))
          print(json.dumps({'include': [
              {'id': f"{c['name']}-{c['version']}", 'name': c['name'], 'version': c['version'], 'targets': c['target_count']}
              for c in data['crates']
          ]}, separators=(',', ':')))
          PY
          )"
          echo "value=$value" >> "$GITHUB_OUTPUT"

  verify:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install RAPx-compatible nightly
        run: rustup toolchain install "${{ needs.setup.outputs.toolchain }}" --profile minimal --component rustc-dev,rust-src,llvm-tools-preview
      - uses: actions/download-artifact@v4
        with:
          name: rapx-bin
          path: ${{ runner.temp }}/rapx
      - name: Configure RAPx
        run: |
          chmod +x "$RUNNER_TEMP/rapx/bin/rapx" "$RUNNER_TEMP/rapx/bin/cargo-rapx"
          echo "$RUNNER_TEMP/rapx/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$(rustc +${{ needs.setup.outputs.toolchain }} --print sysroot)/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
      - name: Verify targeted APIs
        run: |
          python3 scripts/run_one.py \
            --crate "vendor/${{ matrix.id }}" \
            --name "${{ matrix.name }}" \
            --version "${{ matrix.version }}" \
            --declared-targets "${{ matrix.targets }}" \
            --manifest targets.json \
            --rapx-version "${{ needs.setup.outputs.rapx_version }}" \
            --toolchain "${{ needs.setup.outputs.toolchain }}" \
            --timeout-minutes "${{ matrix.name == 'smallvec' && inputs.smallvec_timeout_minutes || inputs.timeout_minutes }}" \
            --target-dir "$RUNNER_TEMP/target-${{ matrix.id }}" \
            --output "results/${{ matrix.id }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.id }}
          path: results/${{ matrix.id }}
          retention-days: 30

  summary:
    if: always() && needs.setup.result == 'success'
    needs: [setup, verify]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: collected
      - name: Aggregate counts
        run: |
          python3 scripts/aggregate.py \
            --input collected \
            --manifest targets.json \
            --rapx-version "${{ needs.setup.outputs.rapx_version }}" \
            --toolchain "${{ needs.setup.outputs.toolchain }}" \
            --output "$RUNNER_TEMP/summary"
          cat "$RUNNER_TEMP/summary/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Save dated results to the repository
        if: github.ref_type == 'branch'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          run_date="$(TZ=Asia/Shanghai date +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for publish_attempt in 1 2 3; do
            git fetch origin "$TARGET_BRANCH"
            git checkout --detach --force "origin/$TARGET_BRANCH"
            python3 scripts/persist_results.py \
              --input collected \
              --summary "$RUNNER_TEMP/summary" \
              --results-root results \
              --run-date "$run_date" \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --run-url "$RUN_URL" \
              --commit-sha "$GITHUB_SHA"
            git add results
            if git diff --cached --quiet; then
              echo "Run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT is already stored."
              exit 0
            fi
            git commit -m "Store RAPx results for $run_date (run $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT)"
            if git push origin "HEAD:$TARGET_BRANCH"; then
              exit 0
            fi
            echo "The branch advanced while publishing; retrying ($publish_attempt/3)."
          done
          echo "Failed to publish results after 3 attempts." >&2
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: targeted-summary
          path: ${{ runner.temp }}/summary
          retention-days: 90
